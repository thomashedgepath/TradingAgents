[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
dynamic = ["version"]
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "langchain-core>=1.6.5",
    "langchain-anthropic>=1.7.4",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "markdown-it-py>=4.0",
    "packaging>=24.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "tradingagents[bedrock]".
bedrock = [
    "langchain-aws>=1.5.0",
]
# Local web dashboard: pip install ".[dashboard]". Optional so the core install
# stays lean for CLI-only and library users.
dashboard = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# Background research corpus (tradingagents/knowledge): Postgres client only.
# Enough to run the ingestion worker and to read the corpus during an analysis;
# without the embeddings extra below, both run full-text only.
knowledge = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]
# Local embedding model for the semantic half of the hybrid search. Split from
# [knowledge] because it pulls in torch (~2GB): the worker image needs it, a
# machine that only reads the corpus can skip it and lose only semantic recall.
embeddings = [
    "sentence-transformers>=3.0",
]

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-dashboard = "dashboard.server:main"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "dashboard*"]

[tool.setuptools.package-data]
cli = ["static/*"]
dashboard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not integration\""
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services; run only when asked for, with -m integration",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["results"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor imports in router.py) instead of one statement per name.
combine-as-imports = true
